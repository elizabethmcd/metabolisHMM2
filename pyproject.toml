[project]
name = "metabolisHMM2"
version = "0.1.0"
description = "Exploring genome annotations and phylogenies with marker HMMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.85",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]

[project.scripts]
metabolisHMM2 = "metabolisHMM2.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.15.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metabolisHMM2"]

[tool.hatch.build.targests.wheel.force-include]
"src/metabolisHMM2/data" = "metabolisHMM2/data"